name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install -r requirements-dev.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name CADVersionConverter main.py
      - uses: actions/upload-artifact@v4
        with:
          name: CADVersionConverter
          path: dist/CADVersionConverter.exe
