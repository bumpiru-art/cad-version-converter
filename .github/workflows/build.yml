name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install -r requirements-dev.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name CADVersionConverter main.py
      - uses: actions/upload-artifact@v4
        with:
          name: CADVersionConverter
          path: dist/CADVersionConverter.exe
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CAD 버전 변환기 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/CADVersionConverter.exe
          body: |
            **CADVersionConverter.exe**를 내려받아 더블클릭하면 바로 실행됩니다 (설치 필요 없음).
            DWG 변환에는 무료 프로그램인 ODA File Converter가 필요합니다: https://www.opendesign.com/guestfiles/oda_file_converter
